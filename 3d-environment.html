<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Environment Navigator</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; }

  #blocker {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #instructions {
    color: #fff;
    text-align: center;
    max-width: 480px;
    padding: 32px 40px;
    background: rgba(20, 20, 30, 0.85);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  #instructions h1 {
    margin: 0 0 12px;
    font-size: 24px;
  }

  #instructions p {
    margin: 6px 0;
    font-size: 14px;
    line-height: 1.5;
    color: #cfd3dc;
  }

  #instructions .key {
    display: inline-block;
    background: #333;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 1px 7px;
    font-family: monospace;
    margin: 0 2px;
  }

  #hud {
    position: absolute;
    bottom: 14px;
    left: 14px;
    color: #eee;
    font-size: 12px;
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-radius: 6px;
    z-index: 5;
    pointer-events: none;
    line-height: 1.5;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    z-index: 5;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div id="blocker">
  <div id="instructions">
    <h1>3D Environment Navigator</h1>
    <p>Click to start and lock the mouse</p>
    <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move</p>
    <p><span class="key">Mouse</span> to look around</p>
    <p><span class="key">Space</span> to jump &nbsp; <span class="key">Shift</span> to sprint</p>
    <p><span class="key">Esc</span> to release the mouse</p>
  </div>
</div>

<div id="crosshair"></div>
<div id="hud">WASD: move &nbsp;|&nbsp; Mouse: look &nbsp;|&nbsp; Space: jump &nbsp;|&nbsp; Shift: sprint</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
<script>
(function () {
  let camera, scene, renderer, controls;

  const objects = [];
  let raycaster;

  let moveForward = false;
  let moveBackward = false;
  let moveLeft = false;
  let moveRight = false;
  let canJump = false;
  let sprint = false;

  let prevTime = performance.now();
  const velocity = new THREE.Vector3();
  const direction = new THREE.Vector3();

  init();
  animate();

  function init() {
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 10;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd0ff);
    scene.fog = new THREE.Fog(0x8fd0ff, 0, 750);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 200, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(75, 150, 100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -150;
    dirLight.shadow.camera.right = 150;
    dirLight.shadow.camera.top = 150;
    dirLight.shadow.camera.bottom = -150;
    scene.add(dirLight);

    controls = new THREE.PointerLockControls(camera, document.body);

    const blocker = document.getElementById('blocker');
    const instructions = document.getElementById('instructions');
    const crosshair = document.getElementById('crosshair');

    instructions.addEventListener('click', function () {
      controls.lock();
    });

    controls.addEventListener('lock', function () {
      instructions.style.display = 'none';
      blocker.style.display = 'none';
      crosshair.style.display = 'block';
    });

    controls.addEventListener('unlock', function () {
      blocker.style.display = 'flex';
      instructions.style.display = '';
      crosshair.style.display = 'none';
    });

    scene.add(controls.getObject());

    const onKeyDown = function (event) {
      switch (event.code) {
        case 'ArrowUp':
        case 'KeyW': moveForward = true; break;
        case 'ArrowLeft':
        case 'KeyA': moveLeft = true; break;
        case 'ArrowDown':
        case 'KeyS': moveBackward = true; break;
        case 'ArrowRight':
        case 'KeyD': moveRight = true; break;
        case 'Space': if (canJump) { velocity.y += 15; canJump = false; } break;
        case 'ShiftLeft':
        case 'ShiftRight': sprint = true; break;
      }
    };

    const onKeyUp = function (event) {
      switch (event.code) {
        case 'ArrowUp':
        case 'KeyW': moveForward = false; break;
        case 'ArrowLeft':
        case 'KeyA': moveLeft = false; break;
        case 'ArrowDown':
        case 'KeyS': moveBackward = false; break;
        case 'ArrowRight':
        case 'KeyD': moveRight = false; break;
        case 'ShiftLeft':
        case 'ShiftRight': sprint = false; break;
      }
    };

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);

    buildWorld();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', onWindowResize);
  }

  function buildWorld() {
    // Ground
    let floorGeometry = new THREE.PlaneGeometry(2000, 2000, 50, 50);
    floorGeometry.rotateX(-Math.PI / 2);
    const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x3d9e56 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.receiveShadow = true;
    scene.add(floor);

    // Scattered boxes as obstacles / landmarks
    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    const colors = [0xc0392b, 0x2980b9, 0xf39c12, 0x8e44ad, 0x16a085, 0xd35400];

    for (let i = 0; i < 60; i++) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
      const box = new THREE.Mesh(boxGeometry, material);

      const w = 2 + Math.random() * 6;
      const h = 2 + Math.random() * 20;
      const d = 2 + Math.random() * 6;
      box.scale.set(w, h, d);

      let x, z;
      do {
        x = Math.floor(Math.random() * 400 - 200);
        z = Math.floor(Math.random() * 400 - 200);
      } while (Math.abs(x) < 12 && Math.abs(z) < 12);

      box.position.set(x, h / 2, z);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
      objects.push(box);
    }

    // A ring of pillars around the spawn as an orientation landmark
    const pillarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 30, 12);
    const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.6 });
    const ringRadius = 60;
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
      pillar.position.set(Math.cos(angle) * ringRadius, 15, Math.sin(angle) * ringRadius);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
      objects.push(pillar);
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();

    if (controls.isLocked === true) {
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;
      velocity.y -= 9.8 * 5.0 * delta; // gravity

      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize();

      const speed = sprint ? 160.0 : 80.0;

      if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
      if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

      controls.moveRight(-velocity.x * delta);
      controls.moveForward(-velocity.z * delta);

      controls.getObject().position.y += velocity.y * delta;

      if (controls.getObject().position.y < 10) {
        velocity.y = 0;
        controls.getObject().position.y = 10;
        canJump = true;
      }
    }

    prevTime = time;

    renderer.render(scene, camera);
  }
})();
</script>
</body>
</html>
